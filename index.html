<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngân hàng Câu hỏi Ôn tập Quản lý Dự án Phần mềm (Câu 1 - 38)</title>
  <meta name="description" content="Tài liệu ôn tập và tra cứu nhanh môn Quản lý Dự án Phần mềm từ câu 1 tới câu 38, bám sát sách tài liệu gốc.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231d4ed8'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/></svg>">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Mở danh mục câu hỏi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="#" class="app-brand">
        <div class="brand-icon">QL</div>
        <span class="brand-title">Quản lý Dự án Phần mềm</span>
        <span class="brand-badge">Câu 1 - 38</span>
      </a>
    </div>

    <!-- Live Search -->
    <div class="header-search">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Tra cứu nhanh câu hỏi, từ khóa (gõ số hoặc từ không dấu)..." 
          autocomplete="off"
          spellcheck="false"
        >
        <button id="searchClearBtn" class="search-clear-btn" title="Xóa tìm kiếm">&times;</button>
        <span class="search-kbd">Ctrl+K</span>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="action-btn" id="toggleStarredFilterBtn" title="Lọc câu hỏi đã đánh dấu">
        <span>⭐ Đã lưu</span>
      </button>
      
      <div style="display:flex; gap:2px; border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:2px;">
        <button class="action-btn" id="fontDecBtn" style="border:none; padding:0.35rem 0.5rem;" title="Giảm cỡ chữ">A-</button>
        <button class="action-btn" id="fontIncBtn" style="border:none; padding:0.35rem 0.5rem;" title="Tăng cỡ chữ">A+</button>
      </div>

      <button class="action-btn" id="themeToggleBtn" title="Chuyển chế độ Sáng / Tối">
        <span id="themeIcon">🌙</span>
      </button>

      <button class="action-btn" id="printDocBtn" title="In hoặc xuất PDF toàn bộ tài liệu">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>In / PDF</span>
      </button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Sidebar Backdrop for Mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Mục lục câu hỏi</span>
        <span class="sidebar-counter" id="sidebarCounter">38 câu</span>
      </div>

      <!-- Quick Jump Grid (1..38) -->
      <div class="quick-jump-panel">
        <div class="quick-jump-title">
          <span>Nhảy nhanh đến câu</span>
          <span style="font-size:0.68rem; font-weight:normal;">(1 &rarr; 38)</span>
        </div>
        <div class="quick-jump-grid" id="quickJumpGrid">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Scrollable List of Questions -->
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Filled by JS -->
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Category Filter Chips -->
      <div class="category-filter-wrapper">
        <div class="category-chips" id="categoryChips">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Search Results Banner -->
      <div class="search-results-bar" id="searchResultsBar">
        <span>Đang hiển thị <strong id="resultsCount">38</strong> câu hỏi</span>
        <span class="reset-search-link" id="resetSearchBtn">Xóa bộ lọc & hiện tất cả</span>
      </div>

      <!-- Questions List Container -->
      <div class="questions-list" id="questionsContainer">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Lightbox Modal for Original Scans & Diagrams -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-header">
      <span class="lightbox-title" id="lightboxTitle">Xem ảnh tài liệu gốc</span>
      <div class="lightbox-controls">
        <button class="lightbox-btn" id="lightboxZoomOut" title="Thu nhỏ (-)">➖</button>
        <button class="lightbox-btn" id="lightboxZoomReset" title="Vừa màn hình">1:1</button>
        <button class="lightbox-btn" id="lightboxZoomIn" title="Phóng to (+)">➕</button>
        <button class="lightbox-btn" id="lightboxOpenNewTab" title="Mở ảnh trong tab mới">↗ Tab mới</button>
        <button class="lightbox-btn" id="lightboxCloseBtn" title="Đóng (Esc)">✕ Đóng</button>
      </div>
    </div>

    <div class="lightbox-body">
      <img id="lightboxImg" class="lightbox-img" src="" alt="Ảnh trang sách gốc">
    </div>

    <div class="lightbox-tabs" id="lightboxTabs">
      <!-- Multi-page tabs if question spans 2 pages -->
    </div>
  </div>

  <!-- Floating Back to Top Button -->
  <button class="back-to-top" id="backToTopBtn" title="Về đầu trang">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Toast Notification -->
  <div class="toast-notice" id="toastNotice">Đã sao chép!</div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
